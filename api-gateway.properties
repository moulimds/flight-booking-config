# ==============================================================================
# API Gateway Configuration (Port 8080)
# ==============================================================================
server.port=8080
spring.application.name=API-GATEWAY

# Spring Cloud Gateway Service Routes via Eureka
# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/auth/**

# Flight Service
spring.cloud.gateway.routes[1].id=flight-service
spring.cloud.gateway.routes[1].uri=lb://FLIGHT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/flights/**,/flights/**

# Search Service
spring.cloud.gateway.routes[2].id=search-service
spring.cloud.gateway.routes[2].uri=lb://SEARCH-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/search/**,/search/**

# Booking Service
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**,/bookings/**

# Fare Service
spring.cloud.gateway.routes[4].id=fare-service
spring.cloud.gateway.routes[4].uri=lb://FARE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/fares/**,/fares/**

# Seat Service
spring.cloud.gateway.routes[5].id=seat-service
spring.cloud.gateway.routes[5].uri=lb://SEAT-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/seats/**,/seats/**

# Payment Service
spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/payments/**,/payments/**

# Invoice Service
spring.cloud.gateway.routes[7].id=invoice-service
spring.cloud.gateway.routes[7].uri=lb://INVOICE-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/invoices/**,/invoices/**

# Notification Service
spring.cloud.gateway.routes[8].id=notification-service
spring.cloud.gateway.routes[8].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/notifications/**,/notifications/**

# Checkin Service
spring.cloud.gateway.routes[9].id=checkin-service
spring.cloud.gateway.routes[9].uri=lb://CHECKIN-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/checkins/**,/checkins/**

# Profile Service
spring.cloud.gateway.routes[10].id=profile-service
spring.cloud.gateway.routes[10].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/profiles/**,/profiles/**

# Flight Tracking Service
spring.cloud.gateway.routes[11].id=flight-tracking-service
spring.cloud.gateway.routes[11].uri=lb://FLIGHT-TRACKING-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/flight-tracking/**,/flight-tracking/**

# Global CORS Configuration for Web Client
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Deduplicate CORS headers to prevent duplicate response headers
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
