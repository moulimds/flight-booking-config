# Database Dialect & JPA Defaults
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sindhu@07}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# RabbitMQ Event Broker
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Netflix Eureka Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Spring Actuator Endpoints & Telemetry
management.endpoints.web.exposure.include=health,info,metrics,refresh
management.endpoint.health.show-details=always

# JWT Security Defaults
jwt.secret=9a61f56cbd29fed7bcb6128a6f4ad5b5d4e6d6e7528d7070d76f66bda4e9f000
jwt.expiration=86400000
