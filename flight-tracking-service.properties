# ==============================================================================
# Live Flight Telemetry & Radar Service (Port 8092)
# ==============================================================================
server.port=8092
spring.application.name=FLIGHT-TRACKING-SERVICE

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/flight_tracking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Flight Radar Event Routing Keys
flight.tracking.exchange=flight.tracking.exchange
flight.tracking.location.key=flight.tracking.location.updated
flight.tracking.status.key=flight.tracking.status.changed
flight.tracking.delay.key=flight.tracking.delayed
flight.tracking.gate.key=flight.tracking.gate.changed
flight.tracking.depart.key=flight.tracking.departed
flight.tracking.land.key=flight.tracking.landed
flight.tracking.cancel.key=flight.tracking.cancelled
